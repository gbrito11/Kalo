name: Android (APK + testes)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Modelo local (opcional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download model -p "food_model.onnx" -p "labels.txt" -D composeApp/src/androidMain/assets 2>/dev/null \
            || echo "Sem modelo local: a app usa só o Gemini para as fotos."

      - name: Testes + APK
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Forma-apk
          path: composeApp/build/outputs/apk/debug/*.apk
